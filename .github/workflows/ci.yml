name: CI

on:
  push:
    branches: [main, rewrite, feature/tdd-implementation]
  pull_request:
    branches: [main, rewrite, feature/tdd-implementation]

jobs:
  # Quality checks first (fast feedback)
  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Check frontend formatting
        run: npm run format:check || echo "⚠️  Frontend format check not configured"

  linting:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run frontend linter
        run: npm run lint || echo "⚠️  Frontend lint not configured"

  # Then run tests
  test:
    name: Test (Rust)
    runs-on: ${{ matrix.os }}
    needs: [formatting, linting]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --lib --verbose
